<!DOCTYPE html>
<html lang="en-US">
<head>
	<meta charset="UTF-8">
	<title>FloatingMilkshake!</title>
	<link href="https://cdn.floatingmilkshake.com/avatar.png" rel="icon">
	<link href="styles.css" rel="stylesheet" type="text/css">
	<meta content="width=device-width, initial-scale=1.0" name="viewport">
	<link href="https://fonts.googleapis.com" rel="preconnect">
	<link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
	<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400&display=swap" rel="stylesheet">
	<style>
		html {
			min-height: 100vh;
		}

		@media (prefers-color-scheme: light) {
			html {
				background: linear-gradient(#5d526b, #343434);
			}
		}

		@media (prefers-color-scheme: dark) {
			html {
				background: linear-gradient(#5d526b, #000000);
			}
		}

		body {
			color: #FFFFFF;
			font-family: "Quicksand";
			font-weight: 300;
		}

		h1 {
			font-size: 25px;
			line-height: 26px;
		}

		p {
			font-size: 16px;
		}

		a {
			color: #4c9eff;
			text-decoration: none;
			font-weight: 400;
		}

		a:hover {
			color: #48bce0;
			font-weight: 400;
		}

		.center {
			text-align: center;
		}

		#main-container {
			max-width: 650px;
			padding: 0px 10px;
			margin: 40px auto;
		}
	</style>
</head>
<body>
	<div id="main-container">
		<h1 class="center">Hello...!</h1>
		<p>
			You've found the domain I use for some of my internal services. There's nothing to see here. Perhaps you're looking for <a href="https://floatingmilkshake.com/">floatingmilkshake.com</a> instead?
		</p>
	</div>
</body>
</html>
